schema_version: 1

context:
  name: sherlock-lib
  version: "0.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/sherlock_lib-${{ version }}.tar.gz
  sha256: 99d7a4acf1a479babb4361e1b862c0e89bae2fa954e2af9f34a0fe8e4318e933

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - certifi ==2019.6.16
    - pysocks ==1.7.0
    - requests ==2.22.0
    - requests-futures ==1.0.0
    - stem ==1.8.0
    - exrex ==0.11.0

tests:
  - python:
      imports:
        - sherlock_lib
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: 🔎 Hunt down social media accounts by username across social networks
  license: MIT
  license_file: LICENSE
  homepage: http://sherlock-project.github.io/

extra:
  recipe-maintainers:
    - jan-janssen
